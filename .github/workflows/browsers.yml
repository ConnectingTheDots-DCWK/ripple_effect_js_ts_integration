# The browser pass: every conformance fixture in Chromium, Firefox and
# WebKit, through the package as Vite bundles it, loading each bundle over
# HTTP. By hand — before a release, and after anything that changes what jco
# is given or what a bundler sees.
name: browsers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node at mise.toml's version; pnpm/action-setup reads packageManager.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2
          install_args: node
      - run: pnpm install --frozen-lockfile
      - run: pnpm engine
      - run: pnpm --filter @ripplefx/player exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @ripplefx/player browsers
      - run: pnpm --filter @ripplefx/soundscape browsers
